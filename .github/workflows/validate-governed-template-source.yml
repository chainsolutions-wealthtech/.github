name: Validate Governed Repository Template Source

on:
  push:
    branches:
      - main
    paths:
      - repository-templates/governed-repository-template/**
      - .github/workflows/validate-governed-template-source.yml
  pull_request:
    paths:
      - repository-templates/governed-repository-template/**
      - .github/workflows/validate-governed-template-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate template source
        working-directory: repository-templates/governed-repository-template
        run: python3 scripts/validate_governance.py

      - name: Compile bootstrap scripts
        working-directory: repository-templates/governed-repository-template
        run: python3 -m py_compile scripts/initialize_governance.py scripts/validate_governance.py

      - name: Simulate repository instantiation
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a repository-templates/governed-repository-template/. "$tmp/"
          cd "$tmp"
          python3 scripts/initialize_governance.py \
            --repository "chainsolutions-wealthtech/template-ci-fixture" \
            --project-name "Template CI Fixture" \
            --project-type "test-fixture" \
            --owner "@chainsolutions-wealthtech"
          test ! -e .template-source
          ! grep -R -n -E '\{\{[A-Z0-9_]+\}\}' \
            --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.txt' \
            . --exclude='initialize_governance.py'
          python3 scripts/validate_governance.py

      - name: Check textual integrity
        run: git diff --check
